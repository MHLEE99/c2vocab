<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>c2vocab — generar iconos</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; background: #f5f6f8; color: #1c1f24; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p.note { color: #6b7280; font-size: 14px; max-width: 720px; }
    .icons { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 16px; }
    .icon { background: #fff; border: 1px solid #dfe3e8; border-radius: 12px; padding: 12px; width: 200px; text-align: center; }
    .icon canvas { width: 128px; height: 128px; background: repeating-conic-gradient(#e5e7eb 0 25%, #fff 0 50%) 0 0 / 16px 16px; border-radius: 6px; }
    .icon a { display: inline-block; margin-top: 8px; font-size: 14px; }
    .status { font-size: 13px; color: #1b7f4b; min-height: 18px; margin-top: 4px; }
    .status.err { color: #b3261e; }
  </style>
</head>
<body>
  <h1>c2vocab — iconos de la app</h1>
  <p class="note">
    Dibuja los cuatro PNG en &lt;canvas&gt;. Guarda cada uno con su enlace, o abre esta página con
    <code>?post=1</code> mientras <code>python tools/save_icons.py</code> está en marcha: entonces los
    envía a <code>http://127.0.0.1:8766/</code> y el script los escribe en <code>icons/</code>.
  </p>
  <div id="icons" class="icons"></div>

  <script>
    // Standalone page: no app modules, so it also works when the app itself is broken.
    const COLOR = '#1f5f8b';
    const RECEIVER = 'http://127.0.0.1:8766/';

    // name, pixel size, full-bleed? (maskable and the iOS touch icon fill the whole square:
    // the platform applies its own mask; transparent corners would show up black on iOS)
    const SPECS = [
      { name: 'icon-512.png', size: 512, fullBleed: false },
      { name: 'maskable-512.png', size: 512, fullBleed: true },
      { name: 'icon-192.png', size: 192, fullBleed: false },
      { name: 'apple-touch-icon.png', size: 180, fullBleed: true },
    ];

    function roundedRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.arcTo(x + w, y, x + w, y + r, r);
      ctx.lineTo(x + w, y + h - r);
      ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
      ctx.lineTo(x + r, y + h);
      ctx.arcTo(x, y + h, x, y + h - r, r);
      ctx.lineTo(x, y + r);
      ctx.arcTo(x, y, x + r, y, r);
      ctx.closePath();
    }

    function draw(spec) {
      const canvas = document.createElement('canvas');
      canvas.width = spec.size;
      canvas.height = spec.size;
      const ctx = canvas.getContext('2d');
      const s = spec.size;

      ctx.fillStyle = COLOR;
      if (spec.fullBleed) {
        ctx.fillRect(0, 0, s, s);
      } else {
        roundedRect(ctx, 0, 0, s, s, s * 0.22);
        ctx.fill();
      }

      // 'C2' in a heavy sans-serif. On the maskable icon the text stays inside the central 80%
      // (the safe zone); at 48px the two glyphs are still legible.
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      const fontSize = Math.round(s * (spec.fullBleed ? 0.5 : 0.56));
      ctx.font = `800 ${fontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif`;
      // Baseline placed so the capital letters sit visually centred (cap height ~ 0.72 em).
      const baseline = s / 2 + fontSize * 0.36;
      ctx.fillText('C2', s / 2, baseline);
      return canvas;
    }

    function dataUrlToBase64(dataUrl) {
      return dataUrl.slice(dataUrl.indexOf(',') + 1);
    }

    async function post(name, base64, statusEl) {
      try {
        // text/plain + no-cors: no preflight, the receiver only needs the body.
        await fetch(RECEIVER, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ name, base64 }),
        });
        statusEl.textContent = 'enviado';
      } catch (err) {
        statusEl.className = 'status err';
        statusEl.textContent = 'no enviado: ' + (err && err.message ? err.message : err);
      }
    }

    const shouldPost = new URLSearchParams(location.search).get('post') === '1';
    const root = document.getElementById('icons');
    for (const spec of SPECS) {
      const canvas = draw(spec);
      const dataUrl = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.href = dataUrl;
      link.download = spec.name;
      link.textContent = 'Descargar ' + spec.name;
      const label = document.createElement('div');
      label.textContent = `${spec.name} (${spec.size}px${spec.fullBleed ? ', completo' : ''})`;
      const status = document.createElement('div');
      status.className = 'status';
      const box = document.createElement('div');
      box.className = 'icon';
      box.append(canvas, label, link, status);
      root.appendChild(box);
      if (shouldPost) post(spec.name, dataUrlToBase64(dataUrl), status);
    }
  </script>
</body>
</html>
