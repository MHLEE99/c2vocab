<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5f8b">
  <!-- PWA: manifest + icons + home-screen metas. All paths relative: the site lives under /c2vocab/. -->
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="C2 Vocab">
  <title>c2vocab</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="view-title" class="topbar-title">Inicio</h1>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <button id="fab" class="fab" type="button" aria-label="Añadir tarjeta" title="Añadir (n)">+</button>

  <nav id="nav" class="bottom-nav" aria-label="Navegación principal"></nav>

  <div id="toast-root" class="toast-root" hidden></div>
  <div id="sheet-root" class="sheet-root" hidden></div>

  <!-- Dexie must be a classic script so window.Dexie exists before the module runs. -->
  <script src="./vendor/dexie.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
