<!DOCTYPE html>
<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5f8b">
  <!-- Home-screen / standalone metas arrive with the manifest and service worker in step 4. -->
  <title>c2vocab</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

    <h1 id="view-title" class="topbar-title">Inicio</h1>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <button id="fab" class="fab" type="button" aria-label="Añadir tarjeta" title="Añadir (n)">+</button>

  <nav id="nav" class="bottom-nav" aria-label="Navegación principal"></nav>
